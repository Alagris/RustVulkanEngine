[package]
name = "Game"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
log = "0.4"
cgmath = "0.18"
png = "0.18"
rayon = "1.12.0"
pretty_env_logger = "0.5"
thiserror = "1"
tobj = { version = "3", features = ["log"] }
vulkanalia = { version = "=0.35.0", features = ["libloading", "provisional", "window"] }
winit = "0.29"
rapier2d = { version = "0.33.0", features = [ "simd-stable", "parallel" ] }

[env]
RUST_LOG = "debug"