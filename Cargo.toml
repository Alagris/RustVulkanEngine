[workspace]
members = ["engine", "editor", "game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
glam = { version = "0.30", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
pretty_env_logger = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
lalrpop-util = "0.22"
shaderc = "0.10.1"
vulkanalia = { version = "=0.35.0", features = ["libloading", "provisional", "window"] }
winit = "0.29"
